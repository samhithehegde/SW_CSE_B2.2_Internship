<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Description List & Nested Lists</title>
</head>
<body>
    <dl>
        <dt>Html</dt>
        <dd>Markup Language for web pages</dd>
    </dl>

    <!-- Nested Lists -->
    <ul>
        <li>Courses</li>
        <ul>
            <li>Web Development: Frontend</li>
            <li>Web Development: Backend</li>
        </ul>
    </ul>
</body>
</html>
