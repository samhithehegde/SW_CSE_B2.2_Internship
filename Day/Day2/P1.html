<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image tag example</title>
</head>
<body>
    <!-- Image tag: -->
    <img src="dog_image.jpg" alt="The image of a dog">
     <!-- src: source | alt: alternative  -->
      <!-- Image tag: jpg/jprg | png | webp |gif -->
    <img src="dog_image.jpg" alt="The image of a dog" width="400px" height="250px">
    <!-- Title - tooltip text -->
    <img src="/SW_CSE_B2.2_Internship/Day/Images/dog.jpg" alt="The image of a dog" title="My name is Tommy">
    <!-- Responsive images: CSS -->
    <!-- ContentDeliveryNetwork / remote server-->
    <img src="https://th.bing.com/th/id/OIP.Ogln1ekBb3mZViJoDvJ_7QHaEK?w=277&h=180&c=7&r=0&o=7&dpr=1.5&pid=1.7&rm=3" alt="Remote image not existing">
</body>
</html>
